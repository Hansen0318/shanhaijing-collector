<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10231f">
  <title>山海經：青丘尋獸</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div class="header-row">
        <div>
          <p class="eyebrow">山海經 · 探索原型</p>
          <h1>青丘</h1>
        </div>
        <div class="header-actions">
          <button id="collection-button" class="collection-button" type="button" aria-label="開啟妖獸圖鑑">📖 <span>收藏</span></button>
          <button id="inventory-button" class="collection-button" type="button" aria-label="開啟物品背包">🎒 <span>背包</span></button>
        </div>
      </div>
      <p id="location-status" class="location-status" aria-live="polite">拖曳探索，雙指或滾輪縮放</p>
    </header>

    <section class="scene-frame" aria-label="可探索的青丘場景">
      <canvas id="game-canvas" aria-label="青丘探索地圖"></canvas>
      <div class="zoom-controls" aria-label="縮放控制">
        <button type="button" data-zoom="in" aria-label="放大">＋</button>
        <button type="button" data-zoom="out" aria-label="縮小">−</button>
        <button type="button" data-zoom="reset" aria-label="重設視角">◎</button>
      </div>
    </section>

    <footer class="game-footer">
      <span>尋找青丘深處的妖獸蹤跡</span>
      <span id="zoom-readout">100%</span>
    </footer>
  </main>

  <div id="collection-modal" class="collection-modal" hidden>
    <div class="collection-card" role="dialog" aria-modal="true" aria-labelledby="collection-title">
      <div class="collection-head">
        <div>
          <p class="eyebrow">COLLECTION</p>
          <h2 id="collection-title">妖獸圖鑑</h2>
          <p id="collection-progress">0 / 10 已發現</p>
        </div>
        <button id="collection-close" class="collection-close" type="button" aria-label="關閉">×</button>
      </div>
      <div id="collection-grid" class="collection-grid"></div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
  <script type="module" src="inventory-ui.js"></script>
</body>
</html>
